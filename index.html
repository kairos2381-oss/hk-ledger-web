<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="color-scheme" content="light dark"><title>업무장부</title><meta name="theme-color" content="#1F3347"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="업무장부"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>한국열쇠 업무장부</title>
<style>
/* 폰 한 손 조작용 앱 셸: 상단 제목줄 · 가운데 스크롤 · 하단 탭 4개(장부/재고/주문/더보기), 입력은 아래에서 올라오는 시트 */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#18212b; --muted:#5f6b78; --line:#dde2e8; --soft:#f4f6f8;
  --navy:#1f3347; --navy-ink:#ffffff;
  --brass:#b98a2e; --brass-weak:#f6eedc; --brass-ink:#4a3611;
  --inc:#1c7a52; --inc-weak:#e3f3eb; --exp:#c23d2a; --exp-weak:#fbe8e4;
  --warn:#b7590a; --warn-weak:#fdf0e1;
  --scrim:rgba(12,18,26,.45); --shadow:0 1px 2px rgba(20,32,48,.07);
  --font:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --card:#18202a; --ink:#e7ecf1; --muted:#97a3b0; --line:#2a3542; --soft:#1f2934;
    --navy:#6f9ccc; --navy-ink:#0c1520;
    --brass:#dcae55; --brass-weak:#33290f; --brass-ink:#f3dca8;
    --inc:#3fc48b; --inc-weak:#14302a; --exp:#f2775f; --exp-weak:#3a1d18;
    --warn:#f2a54a; --warn-weak:#33240f;
    --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --card:#18202a; --ink:#e7ecf1; --muted:#97a3b0; --line:#2a3542; --soft:#1f2934;
  --navy:#6f9ccc; --navy-ink:#0c1520;
  --brass:#dcae55; --brass-weak:#33290f; --brass-ink:#f3dca8;
  --inc:#3fc48b; --inc-weak:#14302a; --exp:#f2775f; --exp-weak:#3a1d18;
  --warn:#f2a54a; --warn-weak:#33240f;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthhead{display:flex;align-items:center;justify-content:center;gap:0;width:100%}
.monthhead>button{border:0;background:transparent;width:40px;height:40px;border-radius:12px;font-size:26px;line-height:1;color:var(--ink);flex:none}
.monthhead>button:active{background:var(--soft)}
.monthhead .mh{flex:0 1 auto;min-width:0;width:auto;height:auto;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 6px}
.monthhead .mh b{font-size:21px;letter-spacing:-.5px}
.mtoday{display:block;margin:-2px auto 0;border:0;background:transparent;font-size:12px;color:var(--muted);font-weight:500;padding:0 0 2px}
.monthbar{display:flex;align-items:center;gap:2px}
.monthbar button{border:0;background:transparent;width:36px;height:36px;border-radius:10px;font-size:17px;color:var(--muted)}
.monthbar b{font-size:16px;min-width:96px;text-align:center}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:transparent;padding:6px 0 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--navy)}
.nav button.on svg{stroke-width:2.2}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--exp);color:#fff;font-size:10.5px;border-radius:999px;padding:0 5px;min-width:17px;line-height:17px;text-align:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13.5px;color:var(--muted);font-weight:600;letter-spacing:.1px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3 div{min-width:0}
.sum3 .k{font-size:12px;color:var(--muted)}
.sum3 .v{font-size:18px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.inc,.inc-t{color:var(--inc)} .v.exp,.exp-t{color:var(--exp)}
.subnote{font-size:12px;color:var(--muted);margin-top:6px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.kind button.on[data-v="in"]{background:var(--inc);color:#fff}
.seg.kind button.on[data-v="out"]{background:var(--exp);color:#fff}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 6px;font-size:13.5px}
.dayhead b{font-size:14.5px}
.dayhead span{display:flex;gap:10px;font-weight:700}
.entry{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:6px 0;width:100%;text-align:left}
.entry .bar{width:4px;border-radius:4px;flex:none;background:var(--inc)}
.entry.out .bar{background:var(--exp)}
.entry .body{flex:1;min-width:0}
.entry .l1{display:flex;align-items:center;gap:6px}
.entry .amt{margin-left:auto;font-weight:800;font-size:16px;white-space:nowrap}
.entry .l2{color:var(--muted);font-size:13.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.tax{background:transparent;border-color:transparent;color:var(--muted);font-weight:600;padding:2px 2px}
.tm{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.chip.prod{background:var(--brass-weak);color:var(--brass-ink);border-color:transparent}
.prods{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
.cal .wd.sun,.cal .d.sun .dn{color:var(--exp)} .cal .wd.sat,.cal .d.sat .dn{color:var(--navy)}
.cal .d{border:0;background:transparent;border-radius:10px;min-height:76px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.cal .d .dn{font-size:13.5px;font-weight:700}
.cal .d small{font-size:10.5px;font-weight:700;line-height:1.25;white-space:nowrap}
.cal .d small.net-t{color:var(--ink);font-weight:800}
.calkey{display:flex;justify-content:center;gap:12px;font-size:11.5px;color:var(--muted);margin-top:6px}
.cal .d.today .dn{background:var(--navy);color:var(--navy-ink);border-radius:999px;padding:0 6px}
.cal .d.sel{background:var(--brass-weak)}
.cal .d.blank{visibility:hidden}

.bars .row{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
.bars .row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bars .fill{display:block;height:100%;border-radius:6px;background:var(--navy)}
.bars .fill.exp{background:var(--exp)} .bars .fill.inc{background:var(--inc)} .bars .fill.brass{background:var(--brass)}
.bars .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .v small{color:var(--muted);margin-left:6px}
.bars .row.tap{width:100%;border:0;background:transparent;text-align:left;padding:6px 4px;margin:2px -4px;border-radius:10px;grid-template-columns:88px 1fr auto 12px;font-size:13.5px}
.bars .row.tap:active{background:var(--soft)}
.chev{color:var(--muted);font-size:16px;text-align:right}
.dsum{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0 6px}
.dsum span{color:var(--muted);font-size:14px}.dsum b{font-size:22px}
.dlist .drow{display:flex;gap:12px;align-items:baseline;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:13px 2px;font-size:15px}
.drow .dd{color:var(--muted);width:46px;flex:none}.drow .dt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drow .da{font-weight:800;flex:none}
.stack{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--soft);margin:4px 0 10px}
.stack span{display:block;height:100%}

.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;border:0;background:var(--navy);color:var(--navy-ink);border-radius:18px;height:56px;padding:0 20px;font-size:16px;font-weight:800;box-shadow:0 6px 16px rgba(20,32,48,.25);display:flex;align-items:center;gap:6px}
.fab span{font-size:24px;line-height:1;margin-top:-2px}

.search{display:flex;gap:8px;margin:8px 0}
.input,.search input,select.input{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font-size:16px}
textarea.input{height:auto;min-height:72px;padding:10px 12px;resize:vertical;line-height:1.5}
.btn{border:0;border-radius:12px;height:46px;padding:0 16px;font-weight:800;font-size:15px;background:var(--navy);color:var(--navy-ink);white-space:nowrap}
.btn.brass{background:var(--brass);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--exp);border:1px solid var(--line)}
.btn.sm{height:36px;font-size:13.5px;padding:0 12px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.pick{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.pick.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.invsum{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 2px 4px}
.invsum b{color:var(--ink)}
.thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none;background:var(--soft);display:block;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.big{width:84px;height:84px;margin-right:12px}
.qtyctl{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;margin-top:12px}
.qtyctl .pm{width:48px;height:46px}
.qtyctl input{text-align:center;font-size:20px;font-weight:800}
.lmrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:6px 0}
.lmrow:first-child{border-top:0}
.lmname{flex:1;min-width:0;text-align:left;border:0;background:transparent;font-size:16px;font-weight:700;padding:10px 4px;border-radius:10px;line-height:1.3;word-break:keep-all}
.lmrow.on .lmname{color:var(--navy)}
.lmdel{flex:none;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--exp);background:transparent;color:var(--exp);font-weight:800;font-size:14.5px}
.picklist{margin-top:6px}
.picklist .item{padding:9px 8px 9px 12px}
.addbtn{flex:none;height:40px;width:84px;padding:0 12px;border-radius:10px;border:0;background:var(--navy);color:var(--navy-ink);font-weight:800;font-size:14px}
.addbtn.on{background:var(--brass);color:#fff}
.ordhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.ordhead span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ordtot{text-align:right}
.ordtot small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.ordtot b{font-size:28px;font-weight:800;letter-spacing:-.6px;color:var(--brass-ink);line-height:1.15}
.ordtot b em{font-style:normal;font-size:16px;margin-left:2px}
.ordbtn.sm{width:38px;height:40px}
.lmedit{flex:none;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.rcpt{padding:10px 0;border-top:1px solid var(--line)}
.rcpt:first-of-type{border-top:0}
.rcpt .rh{display:flex;align-items:baseline;gap:8px}
.rcpt .rh b{font-size:14.5px}
.rcpt .rh span{flex:1;font-size:12.5px;color:var(--muted)}
.rcpt .ri{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.ordbtn{flex:none;width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px}
.ordbtn:disabled{opacity:.25}
.grphead{display:flex;justify-content:space-between;align-items:baseline;margin:12px 2px 2px;font-size:13px;color:var(--muted)}
.grphead b{font-size:14px;color:var(--ink)}
.item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 8px 6px 12px;margin:4px 0}
.item .info{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.item .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .qty{text-align:center;min-width:40px}
.item .qty b{display:block;font-size:16px;line-height:1.1}
.item .qty small{font-size:10px;color:var(--muted)}
.item.low .qty b{color:var(--exp)}
.pm{width:34px;height:34px;border-radius:9px;border:0;font-size:18px;font-weight:700;flex:none}
.pm.plus{background:var(--navy);color:var(--navy-ink)}
.pm.minus{background:var(--brass);color:#fff}
.pm.mv{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-size:14px}
.pm.mv:disabled{opacity:.3}
.reobar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:9px 10px 9px 14px;margin:0 0 8px;font-size:14px;font-weight:700}
.reobar .btn{background:#fff;color:#18212b;border:0}
.item button.info.mvtap{background:transparent;border:0;text-align:left;color:inherit;padding:0}
.mvh{font-size:13px;color:var(--muted);margin:18px 2px 8px;font-weight:700}
.poslist{display:flex;flex-direction:column;gap:6px}
.posbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.posbtn span{min-width:22px;font-weight:800;color:var(--muted)}
.posbtn.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.posbtn.on span{color:inherit}

.orow{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}
.orow .nm{flex:1;min-width:0;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .nm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.step button{width:28px;height:28px;border:0;background:var(--soft);font-size:15px;font-weight:700}
.step span{min-width:24px;font-size:13px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);width:32px;height:34px;font-size:18px;flex:none}
.x:disabled{opacity:.25}
.lowtag{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-weak);border-radius:999px;padding:1px 8px;margin-left:6px}

.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0;background:var(--warn-weak);color:var(--warn);line-height:1.5}
.banner.info{background:var(--brass-weak);color:var(--brass-ink)}
.banner button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;padding:0;margin-left:4px}

/* 시트 */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:720px;max-height:94%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.shead{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;border-bottom:1px solid var(--line);background:var(--card)}
.shead h2{flex:1;margin:0;font-size:17px}
.shead .close{border:0;background:var(--soft);border-radius:10px;width:36px;height:36px;font-size:18px}
.sbody{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sfoot{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.sfoot .btn{flex:1}
.fld{margin:12px 0}
.fld>label,.fld>.lb{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.amtin{font-size:24px!important;font-weight:800;height:56px!important;text-align:right;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.plist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 10px}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;text-align:left}
.pickrow:first-child{border-top:0}
.pickrow .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickrow small{color:var(--muted)}
.hist{font-size:13.5px}
.hist div{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.hist div:first-child{border-top:0}

async function copyText(text){
  try{if(isNative&&Plug.Clipboard){await Plug.Clipboard.write({string:text});return true}}catch(_){}
  try{await navigator.clipboard.writeText(text);return true}catch(_){}
  try{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok}catch(_){return false}
}
async function shareFile(filename,text,title){
  if(isNative&&Plug.Filesystem&&Plug.Share){
    try{const r=await Plug.Filesystem.writeFile({path:filename,data:text,directory:"CACHE",encoding:"utf8"});
      await Plug.Share.share({title:title||filename,dialogTitle:title||filename,url:r.uri});return true}
    catch(e){if(e&&/cancel/i.test(String(e.message||e)))return false;toast("파일 보내기에 실패했어요")}
    return false;
  }
  if(!isNative){
    // 아이폰 웹앱: 공유 시트(카톡·파일·드라이브)로 보내고, 안 되면 파일로 내려받기
    const type=/\.csv$/i.test(filename)?"text/csv":"application/json";
    try{const f=new File([text],filename,{type});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:title||filename});return true}}
    catch(e){if(e&&e.name==="AbortError")return false}
    try{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast("파일을 내려받았어요");return true}catch(_){}
  }
  openSheet(el=>{el.innerHTML=shell(title||filename,'<div class="banner info">미리보기에서는 파일 저장이 되지 않아 내용을 보여드려요. 설치한 앱에서는 카톡·드라이브로 바로 보낼 수 있습니다.</div><div class="mono">'+esc(text.slice(0,20000))+(text.length>20000?"\n…":"")+'</div>','<button class="btn" id="cpAll">전체 복사</button>');
    $("cpAll").onclick=async()=>{toast(await copyText(text)?"복사했어요":"복사하지 못했어요")}});
  return false;
}

function fixedDate(m,day){const a=m.split("-").map(Number);const last=new Date(a[0],a[1],0).getDate();return m+"-"+pad(Math.min(day,last))}

  const td=today();let n=0;

        f.last=ds}
      m=addMonth(m,1)}});
  if(n)save();return n;
}

function renameListItem(key,i,nn){const P=st.settings[key],old=P[i];if(nn===old)return true;if(P.includes(nn)){toast("이미 있는 이름이에요");return false}P[i]=nn;
  if(key==="partners")st.entries.forEach(e=>{if(e.partner===old)e.partner=nn});
  if(key==="adSources")st.entries.forEach(e=>{if(e.src===old)e.src=nn});
  if(key==="brands")st.items.forEach(it=>{if(it.brand===old)setItemName(it,nn,it.model)});
  if(key==="expenseCats")st.entries.forEach(e=>{if(e.kind==="out"&&e.cat===old)e.cat=nn});
  save();render();toast("'"+nn+"'(으)로 바꿨어요");return true}
function openListAdd(key,onDone){const L=LISTS[key];
  openSheet(el=>{
    el.innerHTML=shell(L.t+" 등록",'<div class="fld" style="margin-top:14px"><label for="pName">'+L.t+' 이름</label><input class="input" id="pName" autocomplete="off" placeholder="'+L.ph+'"></div><div class="subnote">'+L.desc+' 등록하면 매출 입력할 때 목록에서 고를 수 있고, 더보기 → '+L.t+' 관리에서 지우거나 순서를 바꿀 수 있어요.</div>','<button class="btn" id="pSave">등록</button>');
    const go=()=>{const nm=$("pName").value.trim();if(!nm){toast("이름을 넣으세요");$("pName").focus();return}
      if(!st.settings[key].includes(nm))st.settings[key].push(nm);save();closeSheet();if(onDone)onDone(nm);toast(nm+" 등록했어요")};
    $("pSave").onclick=go;$("pName").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};$("pName").focus();
  });
}
function openListManage(key,opt){const L=LISTS[key];opt=opt||{};
  const r=el=>{const P=st.settings[key];const sel=opt.selected?opt.selected():"";
    let b='<div class="fld" style="margin-top:14px"><label for="lmName">새 '+L.t+' 이름</label><div style="display:flex;gap:8px"><input class="input" id="lmName" autocomplete="off" placeholder="'+L.ph+'"><button class="btn" id="lmAdd" style="flex:none">등록</button></div></div>';
    b+='<div class="lb" style="font-size:12.5px;color:var(--muted);font-weight:600;margin:16px 0 6px">등록된 '+L.t+' — '+(opt.pick?"이름을 누르면 선택, ":"")+'[수정]으로 이름 고치기, [삭제]로 지우기</div><div class="plist">';
    b+=P.length?P.map((p,i)=>'<div class="lmrow'+(p===sel?" on":"")+'"><button class="lmname" data-lm="pick" data-i="'+i+'">'+(p===sel?"✓ ":"")+esc(p)+'</button><button class="lmedit" data-lm="ren" data-i="'+i+'">수정</button><button class="lmdel" data-lm="del" data-i="'+i+'">삭제</button></div>').join(""):'<div class="subnote" style="padding:12px 2px">아직 없어요. 위에서 등록하세요.</div>';
    b+='</div><div class="subnote">'+(key==="brands"?"수정하면 그 브랜드의 품목 이름도 같이 바뀝니다. 삭제해도 품목은 그대로 남습니다.":key==="expenseCats"?"수정하면 지난 지출 기록의 분류도 같이 바뀝니다. 삭제해도 지난 기록은 그대로 남습니다.":"수정하면 지난 장부 기록의 이름도 같이 고쳐집니다. 삭제해도 지난 기록에 적힌 이름은 그대로 남습니다.")+'</div>';
    el.innerHTML=shell(L.t+" 등록·수정·삭제",b,'<button class="btn ghost" data-act="closeSheet">닫기</button>');
    const add=()=>{const nm=$("lmName").value.trim();if(!nm){toast("이름을 넣으세요");$("lmName").focus();return}if(P.includes(nm)){toast("이미 있는 이름이에요");return}P.push(nm);save();if(opt.pick)opt.pick(nm);toast(nm+" 등록했어요");closeSheet();render()};
    $("lmAdd").onclick=add;$("lmName").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
    el.querySelectorAll("[data-lm]").forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.i,nm=P[i];
      if(bt.dataset.lm==="pick"){if(opt.pick){opt.pick(nm);closeSheet()}return}
      if(bt.dataset.lm==="ren"){renameBox(L.t+" 이름 수정",nm,nn=>{const ok=renameListItem(key,i,nn);if(ok&&opt.selected&&opt.selected()===nm&&opt.pick)opt.pick(nn);return ok});return}
      P.splice(i,1);if(opt.removed)opt.removed(nm);save();drawSheet();render();
      toast(nm+" 삭제했어요",()=>{P.splice(i,0,nm);save();if(!$("sheetWrap").hidden)drawSheet();render()})});
  };openSheet(r);
}
function listCard(key,title){const P=st.settings[key];
  return '<div class="card"><h3>'+title+'</h3><div class="plist">'+(P.length?P.map((p,i)=>'<div class="orow"><span class="nm">'+esc(p)+'</span><button class="x" data-act="lUp" data-k="'+key+'" data-i="'+i+'" aria-label="위로" '+(i?"":"disabled")+'>▲</button><button class="x" data-act="lDown" data-k="'+key+'" data-i="'+i+'" aria-label="아래로" '+(i<P.length-1?"":"disabled")+'>▼</button><button class="x" data-act="lDel" data-k="'+key+'" data-i="'+i+'" aria-label="삭제">✕</button></div>').join(""):'<div class="subnote" style="padding:10px 2px">등록된 '+LISTS[key].t+'가 없어요.</div>')+'</div><button class="btn ghost block" data-act="lManage" data-k="'+key+'" style="margin-top:8px">'+LISTS[key].t+' 등록·수정·삭제</button></div>'}
async function entryAction(a,btn){
  const L=btn.dataset.l||"products";
  if(a==="kind"){F.kind=btn.dataset.v;F.cat=catsFor(F.kind)[0]}
  else if(a==="plus"){F.amount=(F.amount||0)+Number(btn.dataset.v)}
  else if(a==="clear"){F.amount=0}
  else if(a==="listAdd"){const k=btn.dataset.k,f=k==="partners"?"partner":"src";openListManage(k,{selected:()=>F[f],pick:nm=>{F[f]=nm},removed:nm=>{if(F[f]===nm)F[f]=""}});return}
  else if(a==="catEdit"){openListManage("expenseCats",{selected:()=>F.cat,pick:nm=>{F.cat=nm},removed:()=>{}});return}
  else if(a==="cat"){F.cat=btn.dataset.v}
  else if(a==="padd"){const it=itemById(btn.dataset.id);const list=F[L];const ex=list.find(p=>p.itemId===it.id);if(ex)ex.qty++;else list.push(L==="costItems"?{itemId:it.id,name:it.name,qty:1,price:it.price||0}:{itemId:it.id,name:it.name,qty:1});if(L==="costItems")F.amount=costTotal();toast(it.name+" "+(ex?ex.qty:1)+"개")}
  else if(a==="pq"){const p=F[L][+btn.dataset.i];p.qty=Math.max(1,p.qty+Number(btn.dataset.v));if(L==="costItems")F.amount=costTotal()}
  else if(a==="prm"){F[L].splice(+btn.dataset.i,1);if(L==="costItems")F.amount=costTotal()}
  else if(a==="pickOpen"){openProdPicker(L);return}
  else if(a==="pcat"){F._pcat=btn.dataset.v;drawSheet();const sb=$("sheet").querySelector(".sbody");if(sb)sb.scrollTop=0;return}
  else if(a==="save"){saveEntry();return}
  else if(a==="del"){if(await confirmBox("이 기록을 삭제할까요?"+((F.products||[]).length?"<br>연결된 제품 재고와 자동 물품비도 같이 되돌립니다.":""),"삭제",true)){deleteEntry(F.id)}return}
  drawSheet();
}
// 매출에서 쓴 제품 → 물품비 지출 자동 기록 (매출 1건당 1건, 매출을 고치면 다시 계산)
function syncCostEntry(sale){
  const items=(sale.products||[]).map(p=>{const it=itemById(p.itemId);return {itemId:p.itemId,name:p.name,qty:p.qty,price:it?(Number(it.price)||0):0}}).filter(x=>x.price>0);
  const total=sum(items,x=>x.price*x.qty);const ex=st.entries.find(x=>x.linkedSale===sale.id);
  if(!total){if(ex)st.entries=st.entries.filter(x=>x!==ex);return 0}
  const memo=[sale.src,sale.memo].filter(Boolean).join(" · ");
  const rec={id:ex?ex.id:uid(),kind:"out",date:sale.date,amount:total,cat:"물품비",src:"",partner:"",memo:"매출 사용 제품"+(memo?" · "+memo:""),products:[],costItems:items,linkedSale:sale.id,ts:(sale.ts||Date.now())-1};
  if(ex)Object.assign(ex,rec);else st.entries.push(rec);return total;
}
function saveEntry(){
  if(!F.amount||F.amount<=0){toast("금액을 입력하세요");$("fAmt").focus();return}
  const e={id:F.id||uid(),kind:F.kind,date:F.date||today(),amount:F.amount,cat:F.cat,src:F.kind==="in"?(F.src||""):"",partner:F.kind==="in"?(F.partner||"").trim():"",memo:(F.memo||"").trim(),products:F.kind==="in"?F.products.map(p=>({itemId:p.itemId,name:p.name,qty:p.qty})):[],ts:F.ts||Date.now()};
  if(F.kind==="out"&&F.cat==="물품비"&&F.costItems.length)e.costItems=F.costItems.map(p=>({itemId:p.itemId,name:p.name,qty:p.qty,price:p.price||0}));
  if(F.linkedSale&&F.kind==="out")e.linkedSale=F.linkedSale;
  if(F.fixedId)e.fixedId=F.fixedId;
  let newFixed=null;
  if(F._repeat&&!F.id&&e.kind==="out"&&e.cat!=="물품비"){newFixed={id:uid(),day:pd(e.date).getDate(),cat:e.cat,memo:e.memo,amount:e.amount,start:e.date,last:e.date,created:Date.now()};e.fixedId=newFixed.id;st.fixed.push(newFixed)}
  const i=st.entries.findIndex(x=>x.id===e.id);const before=i>=0?JSON.stringify(st.entries[i].products||[]):null;const beforeDate=i>=0?st.entries[i].date:null;if(i>=0)st.entries[i]=e;else st.entries.push(e);
  const changed=before===null||before!==JSON.stringify(e.products);
  if(changed){orderUnlink(e.id);orderLink(e.id,e.products)}
  st.moves=st.moves.filter(m=>m.entryId!==e.id);
  e.products.forEach(p=>{if(itemById(p.itemId))st.moves.push({id:uid(),itemId:p.itemId,date:e.date,ts:Date.now(),qty:-p.qty,type:"use",entryId:e.id,memo:[e.partner,e.memo].filter(Boolean).join(" · ")})});
  if(newFixed)runFixed();
  const fromDay=sheetStack.length>1&&sheetStack[sheetStack.length-2]._day;
  save();closeEntrySheet();if(!fromDay&&e.date.slice(0,7)!==ui.month)ui.month=e.date.slice(0,7);render();
  let cost=0;if(e.kind==="in"&&(changed||beforeDate!==e.date)){cost=syncCostEntry(e);save();render();if(sheetStack.length)drawSheet()}
  const n=sum(e.products.filter(p=>itemById(p.itemId)),p=>p.qty);
  if(newFixed){toast("저장했어요 · 매달 "+dayText(newFixed.day)+" 고정지출로 등록");return}
  toast(n&&changed?"저장했어요 · 재고 −"+n+"개, 주문 목록 추가"+(cost?", 물품비 "+won(cost)+"원":""):"저장했어요");
}
function deleteEntry(id){st.entries=st.entries.filter(e=>e.id!==id&&e.linkedSale!==id);st.moves=st.moves.filter(m=>m.entryId!==id);orderUnlink(id);save();closeEntrySheet();render();toast("삭제했어요")}

function renderStock(qm){
  $("title").textContent="재고";$("topRight").innerHTML='<button class="btn sm" data-act="newItem">+ 품목</button>';
  const items=activeItems();
  const value=sum(items,i=>(Number(i.price)||0)*Math.max(qm[i.id],0));
  let h=demoBanner();
  h+='<div class="invsum"><span>품목 <b>'+items.length+'</b></span><span>재고금액 <b class="num">'+won(value)+'원</b></span></div>';
  h+='<div class="search"><input id="invQ" type="search" placeholder="품목 검색 (예: H500, 에버넷)" autocomplete="off" value="'+esc(ui.invQ)+'"></div>';
  const cats=itemCats();if(ui.invCat!=="전체"&&!cats.includes(ui.invCat))ui.invCat="전체";
  h+='<div class="two" style="margin:2px 0 8px"><select class="input" id="invCatSel" aria-label="카테고리"><option value="전체">전체 카테고리</option>'+cats.map(c=>'<option value="'+esc(c)+'"'+(ui.invCat===c?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select><button class="btn ghost" data-act="catManage">카테고리 관리</button></div>';
  if(items.length)h+=ui.invReorder?'<div class="reobar"><span>↕ 순서 바꾸는 중<br><small style="font-weight:500;opacity:.85">▲▼ 한 칸 · 제품 이름 누르면 여러 칸·카테고리 이동</small></span><button class="btn sm" data-act="invReorder">완료</button></div>':'<button class="btn ghost" data-act="invReorder" style="width:100%;margin:0 0 8px">↕ 제품 순서 바꾸기</button>';
  ui.invSort="no";
  const Q=ui.invReorder?"":ui.invQ.toLowerCase();
  let list=items.filter(i=>(ui.invCat==="전체"||i.cat===ui.invCat)&&(!Q||(i.name+" "+(i.brand||"")+" "+(i.note||"")+" "+(i.cat||"")).toLowerCase().includes(Q)));
  const s={no:(a,b)=>(a.no||0)-(b.no||0),name:(a,b)=>a.name.localeCompare(b.name,"ko"),low:(a,b)=>qm[a.id]-qm[b.id],high:(a,b)=>qm[b.id]-qm[a.id]}[ui.invSort];
  list.sort(s);
  if(!items.length)h+='<div class="empty"><b>등록된 품목이 없어요</b>오른쪽 위 <b style="display:inline">+ 품목</b>으로 하나씩 넣거나,<br>더보기 → <b style="display:inline">품목 한꺼번에 등록</b>으로 여러 개를 붙여넣으세요.</div>';
  else if(!list.length)h+='<div class="empty">'+(ui.invCat!=="전체"&&!Q?"<b>"+esc(ui.invCat)+"</b>에 아직 품목이 없어요. 오른쪽 위 + 품목으로 추가하세요.":"조건에 맞는 품목이 없어요.")+'</div>';
  const grouped=ui.invCat==="전체"&&ui.invSort==="no"&&!Q;
  if(grouped){list.sort((a,b)=>(cats.indexOf(a.cat)-cats.indexOf(b.cat))||((a.no||0)-(b.no||0)))}
  let lastCat=null;
  h+=list.map(i=>{const q=qm[i.id];
    const head=grouped&&i.cat!==lastCat?(lastCat=i.cat,'<div class="grphead"><b>'+esc(i.cat||"카테고리 없음")+'</b><span>'+list.filter(x=>x.cat===i.cat).length+'개</span></div>'):"";
    if(ui.invReorder){const sib=items.filter(x=>x.cat===i.cat).sort((a,b)=>(a.no||0)-(b.no||0));const k=sib.indexOf(i);
      return head+'<div class="item"><button class="info mvtap" data-act="iMoveSheet" data-id="'+i.id+'"><div class="nm">'+esc(i.name)+'</div><div class="meta">'+(k+1)+'번째 · 누르면 이동</div></button><button class="pm mv" data-act="iMove" data-id="'+i.id+'" data-v="-1" aria-label="'+esc(i.name)+' 위로"'+(k===0?" disabled":"")+'>▲</button><button class="pm mv" data-act="iMove" data-id="'+i.id+'" data-v="1" aria-label="'+esc(i.name)+' 아래로"'+(k===sib.length-1?" disabled":"")+'>▼</button></div>'}

  $("main").innerHTML=h;

  const q=$("invQ");if(ui.invReorder){q.disabled=true;q.placeholder="순서 바꾸는 중에는 검색이 꺼져요"}q.oninput=()=>{ui.invQ=q.value;const p=q.selectionStart;renderStock(qtyMap());const n=$("invQ");n.focus();try{n.setSelectionRange(p,p)}catch(_){}};

function normNos(){const all=activeItems();const nos=all.map(i=>i.no||0);if(new Set(nos).size!==nos.length||nos.some(n=>!n))all.slice().sort((a,b)=>(a.no||0)-(b.no||0)).forEach((x,k)=>x.no=k+1)}
function catSiblings(it){return activeItems().filter(x=>(x.cat||"")===(it.cat||"")).sort((a,b)=>a.no-b.no)}
function placeItem(id,pos){const it=itemById(id);if(!it)return;normNos();const sib=catSiblings(it);const nos=sib.map(x=>x.no);const arr=sib.filter(x=>x!==it);arr.splice(Math.max(0,Math.min(pos,arr.length)),0,it);arr.forEach((x,k)=>x.no=nos[k]);save();render()}
function moveItem(id,dir){const it=itemById(id);if(!it)return;normNos();const k=catSiblings(it).indexOf(it);placeItem(id,k+dir)}
function setItemCat(it,cat){cat=cat||"";if((it.cat||"")===cat)return false;it.cat=cat;it.no=nextNo();return true}
function openMoveSheet(id){
  openSheet(el=>{const it=itemById(id);if(!it){closeSheet();return}normNos();const sib=catSiblings(it);const k=sib.indexOf(it),n=sib.length;
    const cats=itemCats().filter(c=>c!==(it.cat||""));
    let b='<div class="subnote" style="margin-top:12px">지금 <b>'+esc(it.cat||"카테고리 없음")+'</b> · '+(k+1)+'번째 (전체 '+n+'개)</div>';
    b+='<div class="mvh">순서 — 한 번에 옮기기</div><div class="two"><button class="btn ghost" data-mv="top"'+(k===0?" disabled":"")+'>⤒ 맨 위로</button><button class="btn ghost" data-mv="bottom"'+(k===n-1?" disabled":"")+'>⤓ 맨 아래로</button></div>';
    b+='<div class="mvh">원하는 자리 누르기 (그 자리로 들어가요)</div><div class="poslist">'+sib.map((x,j)=>'<button class="posbtn'+(j===k?" on":"")+'" data-pos="'+j+'"'+(j===k?" disabled":"")+'><span>'+(j+1)+'</span>'+esc(x.name)+(j===k?" ← 지금 위치":"")+'</button>').join("")+'</div>';
    b+='<div class="mvh">다른 카테고리로 옮기기 (새 카테고리 맨 아래로)</div><div class="chips wrap">'+(cats.length?cats.map(c=>'<button class="pick" data-mc="'+esc(c)+'">'+esc(c)+'</button>').join(""):'<span class="subnote">다른 카테고리가 없어요</span>')+'</div>';
    el.innerHTML=shell(it.name,b);
    el.onclick=ev=>{const t=ev.target.closest("[data-mv],[data-pos],[data-mc]");if(!t||t.disabled)return;
      if(t.dataset.mc!==undefined){const oldCat=it.cat||"",oldNo=it.no;setItemCat(it,t.dataset.mc);save();closeSheet();render();toast(it.name+" → "+t.dataset.mc+" (맨 아래)",()=>{it.cat=oldCat;it.no=oldNo;save();render()});return}
      const pos=t.dataset.mv==="top"?0:t.dataset.mv==="bottom"?n-1:Number(t.dataset.pos);placeItem(id,pos);closeSheet();toast(it.name+" → "+(pos+1)+"번째로 옮겼어요")};
  });
}
function addMove(itemId,qty,type,memo,extra){const mv=Object.assign({id:uid(),itemId,date:today(),ts:Date.now(),qty,type,memo:memo||""},extra||{});st.moves.push(mv);save();return mv}
function quickMove(id,dir){const it=itemById(id);const mv=addMove(id,dir,dir>0?"in":"out");render();
  toast(it.name+(dir>0?" 입고 1개":" 출고 1개")+" · 재고 "+qtyMap()[id]+"개",()=>{st.moves=st.moves.filter(m=>m.id!==mv.id);save();render()})}
const TYPE_LABEL={in:"입고",out:"출고",use:"작업 사용",adj:"수량 맞춤",order:"주문 입고"};
function shrinkPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const M=720,r=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.78))};im.src=fr.result};fr.readAsDataURL(file)})}
function catSelect(id,val){const cats=itemCats();if(val&&!cats.includes(val))cats.push(val);return '<select class="input" id="'+id+'"><option value="">카테고리 없음</option>'+cats.map(c=>'<option value="'+esc(c)+'"'+(val===c?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select>'}
function brandSelect(id,val){const L=st.settings.brands.slice();if(val&&!L.includes(val))L.push(val);return '<select class="input" id="'+id+'"><option value="">브랜드 없음</option>'+L.map(c=>'<option value="'+esc(c)+'"'+(val===c?" selected":"")+'>'+esc(c)+'</option>').join("")+'</select>'}
function setItemName(it,brand,model){it.brand=brand;it.model=model;it.name=joinName(brand,model);st.orders.forEach(o=>{if(o.itemId===it.id)o.name=it.name})}
function openItem(id){
  const D={};// 저장 전 입력값 보관 (카테고리·브랜드 관리 다녀와도 유지)
  const r=el=>{const it=itemById(id);if(!it){closeSheet();return}const qm=qtyMap();const q=qm[id];
    const v=k=>D[k]!==undefined?D[k]:(k==="price"?(it.price?won(it.price):""):(it[k]||""));
    const hist=st.moves.filter(m=>m.itemId===id).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,60);
    let b='<div class="card" style="margin-top:12px">';
    b+='<div class="bigq">'+(it.photo?'<button class="thumb big" data-ia="photoView" aria-label="사진 크게 보기"><img src="'+it.photo+'" alt=""></button>':"")+'<div style="flex:1;min-width:0"><div class="subnote" style="margin:0">재고수량</div><b class="num">'+q+'개</b></div></div>';
    b+='<div class="qtyctl"><button class="pm minus" data-ia="nMinus" aria-label="개수 줄이기">−</button><input class="input num" id="iN" inputmode="numeric" value="1" aria-label="개수"><button class="pm plus" data-ia="nPlus" aria-label="개수 늘리기">+</button></div>';
    b+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"><button class="btn sm" data-ia="in">입고 +</button><button class="btn sm brass" data-ia="out">출고 −</button><button class="btn sm ghost" data-ia="adj">수량 맞춤</button></div>';
    b+='<div class="fld" style="margin-bottom:0"><label for="iMemo">입출고 메모 (선택)</label><input class="input" id="iMemo" placeholder="예: 자재상 입고, 현장 사용"></div>';
    b+='<div class="subnote">입고 +·출고 −: 위 개수만큼 늘리거나 줄입니다. 수량 맞춤: 직접 세어본 개수를 넣으면 그 숫자로 맞춥니다.</div></div>';
    b+='<div class="card"><h3>물품정보</h3>';
    b+='<div class="two"><div class="fld" style="margin-top:0"><label for="eCat">카테고리</label>'+catSelect("eCat",v("cat"))+'</div><div class="fld" style="margin-top:0"><label for="eBrand">브랜드</label>'+brandSelect("eBrand",v("brand"))+'</div></div>';
    b+='<div class="two"><button class="btn ghost sm" data-ia="catM">카테고리 관리</button><button class="btn ghost sm" data-ia="brandM">브랜드 등록·수정·삭제</button></div>';
    b+='<div class="fld"><label for="eModel">물품이름 (모델명)</label><input class="input" id="eModel" value="'+esc(v("model"))+'" placeholder="예: 클립형 LH310GC-N"></div>';
    b+='<div class="two"><div class="fld"><label for="ePrice">물품가격(원)</label><input class="input num" id="ePrice" inputmode="numeric" value="'+esc(v("price"))+'"></div><div class="fld"><span class="lb">기초재고</span><div class="input num" style="display:flex;align-items:center;background:var(--soft)">'+(it.base||0)+'개</div></div></div>';
    b+='<div class="fld"><label for="eNote">기타사항</label><input class="input" id="eNote" value="'+esc(v("note"))+'" placeholder="예: 로즈골드, 얇은문"></div>';
    b+='<div class="subnote" style="margin-top:-4px">목록에는 <b>'+esc(joinName(v("brand"),v("model")||"모델명"))+'</b> 으로 보입니다.</div>';
    b+='<div class="two" style="margin-top:10px"><button class="btn ghost" data-ia="photo">'+(it.photo?"사진 바꾸기":"사진 첨부하기")+'</button>'+(it.photo?'<button class="btn danger" data-ia="photoDel">사진 지우기</button>':'<span></span>')+'</div>';
    b+='<input type="file" id="iPhoto" accept="image/*" hidden></div>';
    b+='<button class="btn ghost block" data-ia="toOrder">주문할 자재에 추가</button>';
    b+='<div class="card"><h3>입출고 내역</h3><div class="hist">'+(hist.length?hist.map(m=>'<div><span class="d">'+esc(m.date.slice(5).replace("-","/"))+'</span><span class="t">'+(TYPE_LABEL[m.type]||m.type)+(m.memo?" · "+esc(m.memo):"")+'</span><span class="q '+(m.qty>0?"inc-t":"exp-t")+'">'+(m.qty>0?"+":"")+m.qty+'</span></div>').join(""):'<div><span class="t" style="color:var(--muted)">아직 내역이 없어요. 기초재고 '+(it.base||0)+'개</span></div>')+'</div></div>';
    el.innerHTML=shell(it.name,b,'<button class="btn danger" data-ia="del" style="flex:0 0 auto">삭제</button><button class="btn" data-ia="save">물품정보 저장</button>');
    const keep=()=>{D.cat=$("eCat").value;D.brand=$("eBrand").value;D.model=$("eModel").value;D.price=$("ePrice").value;D.note=$("eNote").value};
    ["eCat","eBrand"].forEach(x=>$(x).onchange=()=>{keep();drawSheet()});
    $("ePrice").oninput=e=>{const n=toNum(e.target.value);e.target.value=n?won(n):""};
    $("iPhoto").onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;keep();try{it.photo=await shrinkPhoto(f);save();drawSheet();render();toast("사진을 넣었어요")}catch(_){toast("사진을 읽지 못했어요")}};
    el.onclick=async ev=>{const t=ev.target.closest("[data-ia]");if(!t)return;const a=t.dataset.ia;const nEl=$("iN");const n=Math.max(0,toNum(nEl.value));const memo=$("iMemo").value.trim();
      if(a==="nPlus"||a==="nMinus"){nEl.value=Math.max(a==="nMinus"?0:1,n+(a==="nPlus"?1:-1));return}
      if(a!=="save"&&a!=="del")keep();
      if(a==="in"||a==="out"){if(!n){toast("개수를 넣으세요");return}addMove(id,a==="in"?n:-n,a,memo);toast((a==="in"?"입고 +":"출고 −")+n+"개 · 재고 "+qtyMap()[id]+"개");drawSheet();render()}
      else if(a==="adj"){const diff=n-qtyMap()[id];if(!diff){toast("이미 "+n+"개예요");return}addMove(id,diff,"adj",memo||("실제 "+n+"개로 맞춤"));toast(n+"개로 맞췄어요");drawSheet();render()}
      else if(a==="toOrder"){addOrder(id,1);toast("주문할 자재에 넣었어요");render()}
      else if(a==="catM"){openCatManage({pick:c=>{D.cat=c}})}
      else if(a==="brandM"){openListManage("brands",{selected:()=>D.brand!==undefined?D.brand:it.brand,pick:nm=>{D.brand=nm},removed:nm=>{if(D.brand===nm)D.brand=""}})}
      else if(a==="photo"){$("iPhoto").click()}
      else if(a==="photoDel"){if(await confirmBox("사진을 지울까요?","지우기",true)){delete it.photo;save();drawSheet();render()}}
      else if(a==="photoView"){openSheet(e2=>{e2.innerHTML=shell(it.name,'<img src="'+it.photo+'" alt="'+esc(it.name)+'" style="width:100%;border-radius:12px;margin-top:12px">')})}
      else if(a==="save"){const model=$("eModel").value.trim();if(!model){toast("물품이름(모델명)을 넣으세요");$("eModel").focus();return}
        setItemName(it,$("eBrand").value,model);setItemCat(it,$("eCat").value);it.price=toNum($("ePrice").value);it.note=$("eNote").value.trim();save();closeSheet();render();toast("저장했어요")}
      else if(a==="del"){const used=st.moves.some(m=>m.itemId===id);if(await confirmBox("<b>"+esc(it.name)+"</b>을(를) 삭제할까요?"+(used?"<br>지난 장부 기록의 제품 이름은 그대로 남습니다.":""),"삭제",true)){if(used)it.archived=true;else st.items=st.items.filter(x=>x.id!==id);st.orders=st.orders.filter(o=>o.itemId!==id);save();closeAll();render();toast("삭제했어요")}}
    };
  };r._keepScroll=true;openSheet(r);
}

      const nm=joinName(D.brand,model);if(st.items.some(i=>!i.archived&&i.name===nm)){toast("같은 품목이 이미 있어요");return}
      st.items.push({id:uid(),no:nextNo(),name:nm,brand:D.brand,model,price:toNum(D.price),base:toNum(D.qty),min:0,cat:D.cat,note:D.note.trim(),created:Date.now()});

function openBulk(){
  openSheet(el=>{
    el.innerHTML=shell("품목 한꺼번에 등록",'<p class="subnote" style="font-size:13.5px;line-height:1.6">한 줄에 한 품목씩, <b>이름, 단가, 지금 재고, 카테고리</b> 순서로 쉼표를 넣어 붙여넣으세요. 이름만 있어도 됩니다. "락프로(H500s)"처럼 쓰면 브랜드와 모델명이 나뉘어 들어갑니다.</p><div class="mono" style="max-height:none">락프로(H500s), 53000, 3, 레버 타입\n마스터즈(7100S), 67000, 2\n힌지수리세트, 3000, 9, 부속품</div><textarea class="input" id="bulkT" style="min-height:180px" placeholder="여기에 붙여넣기"></textarea><div id="bulkInfo" class="subnote"></div>','<button class="btn" id="bulkGo">등록</button>');
    const parse=()=>$("bulkT").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\t|,(?![0-9]{3}\b)/).map(s=>s.trim());const sp=splitName(p[0]);return {name:joinName(sp.brand,sp.model),brand:sp.brand,model:sp.model,price:toNum(p[1]),base:toNum(p[2]),min:0,cat:p[3]||""}}).filter(x=>x.model);
    $("bulkT").oninput=()=>{const r=parse();const dup=r.filter(x=>st.items.some(i=>!i.archived&&i.name===x.name)).length;$("bulkInfo").textContent=r.length?r.length+"개 인식"+(dup?" · 이미 있는 이름 "+dup+"개는 건너뜀":""):""};
    $("bulkGo").onclick=()=>{const r=parse().filter(x=>!st.items.some(i=>!i.archived&&i.name===x.name));if(!r.length){toast("등록할 품목이 없어요");return}let no=nextNo();r.forEach(x=>{st.items.push(Object.assign({id:uid(),no:no++,note:"",created:Date.now()},x));if(x.brand&&!st.settings.brands.includes(x.brand))st.settings.brands.push(x.brand)});save();closeAll();ui.tab="stock";render();toast(r.length+"개 등록했어요")};
  });
}

/* ---- 카테고리 관리 (추가·이름 바꾸기·순서·삭제) ---- */
function openCatManage(opt){opt=opt||{};
  const r=el=>{const cats=itemCats();const cnt={};activeItems().forEach(i=>{cnt[i.cat]=(cnt[i.cat]||0)+1});
    let b='<div class="fld" style="margin-top:14px"><label for="cmName">새 카테고리 이름</label><div style="display:flex;gap:8px"><input class="input" id="cmName" autocomplete="off" placeholder="예: 방화문 타입"><button class="btn" id="cmAdd" style="flex:none">추가</button></div></div>';
    b+='<div class="lb" style="font-size:12.5px;color:var(--muted);font-weight:600;margin:16px 0 6px">▲▼ 순서 바꾸기 · [수정] 이름 바꾸기 · [삭제]는 품목이 없을 때만</div><div class="plist">';
    b+=cats.length?cats.map((c,i)=>'<div class="lmrow"><button class="ordbtn sm" data-cm="up" data-i="'+i+'" aria-label="위로"'+(i?"":" disabled")+'>▲</button><button class="ordbtn sm" data-cm="down" data-i="'+i+'" aria-label="아래로"'+(i<cats.length-1?"":" disabled")+'>▼</button><button class="lmname" data-cm="pick" data-i="'+i+'">'+esc(c)+' <small style="color:var(--muted);font-weight:500">'+(cnt[c]||0)+'개</small></button><button class="lmedit" data-cm="ren" data-i="'+i+'">수정</button><button class="lmdel" data-cm="del" data-i="'+i+'">삭제</button></div>').join(""):'<div class="subnote" style="padding:12px 2px">카테고리가 없어요. 위에서 추가하세요.</div>';
    b+='</div><div class="subnote">이름을 바꾸면 그 카테고리의 품목도 모두 새 이름으로 바뀝니다.'+(opt.pick?" 카테고리 이름을 누르면 선택됩니다.":"")+'</div>';
    el.innerHTML=shell("카테고리 관리",b,'<button class="btn" data-act="closeSheet">완료</button>');
    const add=()=>{const nm=$("cmName").value.trim();if(!nm){toast("이름을 넣으세요");$("cmName").focus();return}if(cats.includes(nm)){toast("이미 있는 카테고리예요");return}cats.push(nm);st.settings.cats=cats;save();toast(nm+" 추가했어요");if(opt.pick){opt.pick(nm);closeSheet()}else drawSheet();render()};
    $("cmAdd").onclick=add;$("cmName").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
    el.querySelectorAll("[data-cm]").forEach(bt=>bt.onclick=async()=>{const i=+bt.dataset.i,c=cats[i],k=bt.dataset.cm;
      if(k==="up"||k==="down"){const j=k==="up"?i-1:i+1;if(j<0||j>=cats.length)return;[cats[i],cats[j]]=[cats[j],cats[i]];st.settings.cats=cats;save();drawSheet();render()}
      else if(k==="pick"){if(opt.pick){opt.pick(c);closeSheet()}}
      else if(k==="ren"){renameBox("카테고리 이름 바꾸기",c,nn=>{if(nn===c)return true;if(cats.includes(nn)){toast("이미 있는 카테고리예요");return false}
        cats[i]=nn;st.settings.cats=cats;st.items.forEach(it=>{if(it.cat===c)it.cat=nn});if(ui.invCat===c)ui.invCat=nn;if(F&&F._pcat===c)F._pcat=nn;save();render();toast("'"+nn+"'(으)로 바꿨어요");return true})}
      else if(k==="del"){if(cnt[c]){toast(c+"에 품목이 "+cnt[c]+"개 있어서 지울 수 없어요. 품목의 카테고리를 먼저 바꾸세요.");return}
        cats.splice(i,1);st.settings.cats=cats;save();drawSheet();render();toast(c+" 삭제했어요",()=>{cats.splice(i,0,c);st.settings.cats=cats;save();if(!$("sheetWrap").hidden)drawSheet();render()})}
    });
  };r._keepScroll=true;openSheet(r);
}
function renameBox(title,cur,apply){
  openSheet(el=>{el.innerHTML=shell(title,'<div class="fld" style="margin-top:14px"><label for="rnName">새 이름</label><input class="input" id="rnName" autocomplete="off" value="'+esc(cur)+'"></div>','<button class="btn ghost" data-act="closeSheet">취소</button><button class="btn" id="rnGo">바꾸기</button>');
    const go=()=>{const nn=$("rnName").value.trim();if(!nn){toast("이름을 넣으세요");return}if(apply(nn)!==false)closeSheet()};
    $("rnGo").onclick=go;$("rnName").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};const x=$("rnName");x.focus();x.select()});
}

/* ---- 주문 ---- */
function addOrder(itemId,qty,name){const ex=itemId?st.orders.find(o=>o.itemId===itemId):st.orders.find(o=>!o.itemId&&o.name===name);
  if(ex)ex.qty+=qty;else{const it=itemId?itemById(itemId):null;st.orders.push({id:uid(),itemId:itemId||null,name:it?it.name:name,qty:Math.max(1,qty),ts:Date.now()})}save()}
// 매출에서 쓴 제품 → 주문 목록 자동 추가 (기록별로 얼마나 넣었는지 기억해서 수정·삭제 때 되돌림)
function orderUnlink(eid){st.orders.forEach(o=>{if(o.auto&&o.auto[eid]){o.qty-=o.auto[eid];delete o.auto[eid]}});st.orders=st.orders.filter(o=>o.qty>0)}
function orderLink(eid,products){products.forEach(p=>{const it=itemById(p.itemId);if(!it)return;let o=st.orders.find(x=>x.itemId===it.id);if(!o){o={id:uid(),itemId:it.id,name:it.name,qty:0,ts:Date.now()};st.orders.push(o)}o.auto=o.auto||{};o.auto[eid]=(o.auto[eid]||0)+p.qty;o.qty+=p.qty})}
function orderTotal(){return sum(st.orders,o=>{const it=o.itemId&&itemById(o.itemId);return it&&it.price?it.price*o.qty:0})}
function renderOrder(qm){
  $("title").textContent="주문할 자재";$("topRight").innerHTML="";
  let h=demoBanner();

function orderText(){return st.orders.map(o=>o.name+" "+o.qty+"개").join("\n")}
function openCopy(){
  const text=orderText();
  openSheet(el=>{el.innerHTML=shell("주문 문구",'<p class="subnote" style="font-size:13.5px">아래 내용이 그대로 복사됩니다. 카톡·문자에 붙여넣어 주문하세요.</p><div class="mono">'+esc(text)+'</div>'+(orderTotal()?'<div class="subnote">재고 단가 기준 예상 금액 '+won(orderTotal())+'원 (문구에는 안 들어감)</div>':""),'<button class="btn brass" id="doCopy">복사하기</button>');

function openReceive(){
  const sel={};st.orders.forEach(o=>sel[o.id]={on:true,qty:o.qty});let rDate=today();
  const draw=el=>{
    const linked=st.orders.filter(o=>o.itemId&&sel[o.id].on);const est=sum(linked,o=>{const it=itemById(o.itemId);return (it&&it.price||0)*sel[o.id].qty});
    let b='<div class="fld" style="margin-top:14px"><label for="rDate">입고 날짜</label><input class="input" type="date" id="rDate" value="'+rDate+'"></div>';
    b+='<p class="subnote" style="font-size:13.5px;line-height:1.6">주문 목록 전체가 체크되어 있어요. <b>입고 처리</b>를 누르면 재고가 늘고, 주문 목록에서 사라지고, 아래 입고 내역에 날짜와 함께 남습니다. 아직 안 온 자재만 체크를 풀어주세요.</p><div class="card" style="padding:4px 12px">';
    b+=st.orders.map(o=>{const it=o.itemId&&itemById(o.itemId);return '<label class="chk"><input type="checkbox" data-rc="'+o.id+'" '+(sel[o.id].on?"checked":"")+'><span class="nm">'+esc(o.name)+'<small>'+(it?"재고 "+qtyMap()[it.id]+"개 → "+(qtyMap()[it.id]+sel[o.id].qty)+"개":"재고에 없는 품목 — 목록에서만 지움")+'</small></span><span class="step"><button type="button" data-rq="'+o.id+'" data-v="-1">−</button><span>'+sel[o.id].qty+'</span><button type="button" data-rq="'+o.id+'" data-v="1">+</button></span></label>'}).join("");
    b+='</div><div class="card" style="display:flex;justify-content:space-between;align-items:baseline"><span class="subnote" style="margin:0">합계 (재고 단가 기준)</span><b class="num" id="rSum" style="font-size:22px">'+won(est)+'원</b></div>';
    el.innerHTML=shell("받은 자재 입고",b,'<button class="btn" id="rGo">입고 처리</button>');
    $("rDate").onchange=e=>{rDate=e.target.value||today()};
    el.querySelectorAll("[data-rc]").forEach(c=>c.onchange=()=>{sel[c.dataset.rc].on=c.checked;drawSheet()});
    el.querySelectorAll("[data-rq]").forEach(c=>c.onclick=e=>{e.preventDefault();const s=sel[c.dataset.rq];s.qty=Math.max(1,s.qty+Number(c.dataset.v));drawSheet()});
    $("rGo").onclick=()=>{const done=st.orders.filter(o=>sel[o.id].on);if(!done.length){toast("체크한 자재가 없어요");return}
      const rid=uid();const items=done.map(o=>({itemId:o.itemId||null,name:o.name,qty:sel[o.id].qty}));
      items.forEach(x=>{if(x.itemId&&itemById(x.itemId))st.moves.push({id:uid(),itemId:x.itemId,date:rDate,ts:Date.now(),qty:x.qty,type:"order",memo:"주문 입고",receiptId:rid})});
      st.receipts.push({id:rid,date:rDate,ts:Date.now(),items,amount:est});
      st.orders=st.orders.filter(o=>!sel[o.id].on);save();closeAll();render();toast(dlabel(rDate)+" "+done.length+"건 입고했어요")};
  };openSheet(draw);
}

function stamp(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())}
async function doBackup(){
  const text=JSON.stringify({app:"hk-ledger",v:1,exportedAt:new Date().toISOString(),state:st});
  const ok=await shareFile("업무장부_백업_"+stamp()+".json",text,"업무장부 백업");
  if(ok){st.settings.lastBackup=new Date().toISOString();save();render();toast("백업 파일을 보냈어요")}
}
function csvCell(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return "﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")}
function csvLedger(){const list=monthEntries(ui.month).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0));
  shareFile("장부_"+ui.month+".csv",toCSV([["날짜","구분","분류","금액","광고유입","거래처","내용","사용 제품"]].concat(list.map(e=>[e.date,e.kind==="in"?"매출":"지출",e.cat,e.kind==="in"?e.amount:-e.amount,e.src||"",e.partner,e.memo,((e.products&&e.products.length)?e.products:(e.costItems||[])).map(p=>p.name+"×"+p.qty).join(" / ")]))),mlabel(ui.month)+" 장부")}
function csvStock(){const qm=qtyMap();shareFile("재고_"+today()+".csv",toCSV([["번호","카테고리","브랜드","물품이름(모델)","품목 전체 이름","단가","재고","재고금액","메모"]].concat(activeItems().sort((a,b)=>(a.no||0)-(b.no||0)).map(i=>[i.no,i.cat,i.brand||"",i.model||i.name,i.name,i.price,qm[i.id],(i.price||0)*Math.max(qm[i.id],0),i.note]))),"재고 목록")}
$("fileIn").addEventListener("change",async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  try{const txt=await f.text();const j=JSON.parse(txt);const s=j&&j.state;if(!s||!Array.isArray(s.entries)||!Array.isArray(s.items))throw new Error("bad");
    const when=j.exportedAt?new Date(j.exportedAt).toLocaleString("ko-KR",{dateStyle:"medium",timeStyle:"short"}):"알 수 없음";
    if(await confirmBox("<b>"+esc(when)+"</b> 백업으로 바꿀까요?<br>장부 "+s.entries.length+"건 · 품목 "+s.items.length+"개<br><br>지금 폰에 있는 기록은 이 백업으로 <b>덮어씌워집니다.</b>","복원",true)){st=normalize(s);st.demo=false;await persist();closeAll();render();toast("복원했어요")}}
  catch(_){toast("업무장부 백업 파일이 아니에요")}});

/* ---------------- 이벤트 ---------------- */
async function act(a,btn){
  btn=btn||{dataset:{}};const d=btn.dataset;
  switch(a){
    case "closeSheet":closeSheet();break;
    case "mPrev":ui.month=addMonth(ui.month,-1);ui.selDay=null;render();break;
    case "mNext":ui.month=addMonth(ui.month,1);ui.selDay=null;render();break;
    case "mToday":ui.month=ym(new Date());ui.selDay=null;render();break;
    case "lview":ui.lview=d.v;render();break;
    case "selDay":openDay(d.d);render();break;
    case "fixed":openFixedList();break;
    case "addOnDay":openEntry(null,{date:ui.selDay});break;
    case "statDetail":openStatDetail(d.k,d.f,d.v);break;
    case "editEntry":{const e=st.entries.find(x=>x.id===d.id);if(e)openEntry(e);break}
    case "goBackup":ui.tab="more";render();window.scrollTo(0,0);break;
    case "newItem":openNewItem();break;
    case "openItem":openItem(d.id);break;
    case "invCat":ui.invCat=d.v;render();break;
    case "invSort":ui.invSort=d.v;render();break;
    case "invReorder":ui.invReorder=!ui.invReorder;if(ui.invReorder)ui.invQ="";render();if(!ui.invReorder)toast("순서를 저장했어요 · 매출 입력 제품 목록에도 같은 순서로 나와요");break;
    case "iMove":moveItem(d.id,Number(d.v));break;
    case "iMoveSheet":openMoveSheet(d.id);break;
    case "qIn":quickMove(d.id,1);break;
    case "qOut":quickMove(d.id,-1);break;
    case "oq":{const o=st.orders.find(x=>x.id===d.id);if(o){o.qty=Math.max(1,o.qty+Number(d.v));save();render()}break}
    case "orm":{const i=st.orders.findIndex(x=>x.id===d.id);if(i>=0){const o=st.orders.splice(i,1)[0];save();render();toast(o.name+" 뺐어요",()=>{st.orders.splice(i,0,o);save();render()})}break}
    case "oAdd":{const nm=(ui.orderAddName||"").trim();if(!nm){toast("자재 이름을 넣으세요");$("oName").focus();break}const it=activeItems().find(i=>i.name===nm);addOrder(it?it.id:null,ui.orderAddQty||1,nm);ui.orderAddName="";ui.orderAddQty=1;render();toast("추가했어요");break}
    case "oLow":addOrder(d.id,Number(d.v));render();break;
    case "oLowAll":{const qm=qtyMap();lowItems(qm).filter(i=>!st.orders.some(o=>o.itemId===i.id)).forEach(i=>addOrder(i.id,Math.max(1,Number(i.min)-qm[i.id])));render();toast("부족 품목을 모두 넣었어요");break}
    case "oCopy":openCopy();break;
    case "oRecv":openReceive();break;
    case "backup":doBackup();break;
    case "restore":$("fileIn").click();break;
    case "csvLedger":csvLedger();break;
    case "csvStock":csvStock();break;
    case "bulk":openBulk();break;
    case "catOrder":case "catManage":openCatManage();break;
    case "rcCancel":{const rc=st.receipts.find(x=>x.id===d.id);if(!rc)break;if(await confirmBox(dlabel(rc.date)+" 입고("+rc.items.length+"건)를 취소할까요?<br>늘었던 재고가 다시 줄고"+(rc.expenseId?", 같이 적은 물품비 지출도 지워집니다":"")+". 주문 목록에는 다시 넣지 않습니다.","입고 취소",true)){st.moves=st.moves.filter(m=>m.receiptId!==rc.id);if(rc.expenseId)st.entries=st.entries.filter(e=>e.id!==rc.expenseId);st.receipts=st.receipts.filter(x=>x.id!==rc.id);save();render();toast("입고를 취소했어요")}break}
    case "catalogQty":{const qm=qtyMap();const todo=[];CATALOG.forEach(c=>{const it=activeItems().find(i=>(i.catKey||i.name)===c[1]);if(it&&qm[it.id]!==c[3])todo.push([it,c[3]-qm[it.id]])});
      if(!todo.length){toast("이미 캡처 기준 수량과 같아요");break}
      if(await confirmBox("기본 목록 품목 <b>"+todo.length+"개</b>의 재고를 10/3 재고관리 앱 캡처 수량으로 맞출까요?<br>예: 락프로(H2000s) 3개, 힌지수리세트 9개<br><br>직접 추가한 품목은 건드리지 않고, 입출고 내역에 '수량 맞춤'으로 남습니다.","수량 넣기")){todo.forEach(([it,diff])=>st.moves.push({id:uid(),itemId:it.id,date:today(),ts:Date.now(),qty:diff,type:"adj",memo:"처음 재고 (10/3 캡처 기준)"}));save();ui.tab="stock";render();toast(todo.length+"개 품목 재고를 넣었어요")}break}
    case "seedCatalog":{const names=activeItems().map(i=>i.name);const add=catalogItems(nextNo(),names);if(!add.length){toast("기본 목록 품목이 이미 모두 있어요");break}
      if(await confirmBox("기본 재고 목록 중 아직 없는 <b>"+add.length+"개</b> 품목을 추가할까요?<br>이미 있는 품목은 건드리지 않습니다.","추가")){st.items=st.items.concat(add);st.settings.catalogSeeded=true;save();ui.tab="stock";render();toast(add.length+"개 추가했어요")}break}
    case "lAdd":openListAdd(d.k,()=>render());break;
    case "lManage":openListManage(d.k);break;
    case "lUp":case "lDown":{const i=+d.i,j=a==="lUp"?i-1:i+1,P=st.settings[d.k];if(j<0||j>=P.length)break;[P[i],P[j]]=[P[j],P[i]];save();render();break}
    case "lDel":{const P=st.settings[d.k],i=+d.i,nm=P[i];P.splice(i,1);save();render();toast(nm+" 지웠어요 (지난 기록은 그대로)",()=>{P.splice(i,0,nm);save();render()});break}
    case "saveCats":{const p=v=>[...new Set(v.split(/[,\n]/).map(s=>s.trim()).filter(Boolean))];const inc=p($("sInc").value);if(!inc.length){toast("분류를 하나 이상 넣으세요");break}st.settings.incomeCats=inc;save();render();toast("분류를 저장했어요");break}
    case "clearDemo":if(await confirmBox("예시 데이터를 모두 지우고 빈 상태로 시작할까요?","지우고 시작")){st=blankState();save();ui.tab="ledger";render();toast("깨끗하게 시작합니다")}break;
    case "wipe":openSheet(el=>{el.innerHTML=shell("전체 지우기",'<p style="line-height:1.6;margin-top:14px">모든 기록이 지워지고 되돌릴 수 없습니다. 계속하려면 아래에 <b>지우기</b>라고 쓰세요.</p><input class="input" id="wipeT" autocomplete="off">','<button class="btn danger" id="wipeGo">전체 지우기</button>');$("wipeGo").onclick=()=>{if($("wipeT").value.trim()!=="지우기"){toast("'지우기'라고 써야 지워집니다");return}st=blankState();st.settings.catalogSeeded=true;save();closeAll();ui.tab="ledger";render();toast("모두 지웠어요")}});break;
  }
}
document.addEventListener("click",e=>{
  const nb=e.target.closest("#nav button");if(nb){ui.tab=nb.dataset.tab;ui.invReorder=false;render();window.scrollTo(0,0);return}
  const ef=e.target.closest("[data-ef]");if(ef&&F&&$("sheet").contains(ef)){entryAction(ef.dataset.ef,ef);return}
  const t=e.target.closest("[data-act]");if(t){act(t.dataset.act,t)}
});
$("fab").onclick=()=>openEntry(null);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")fixedRun()});

if(isNative&&Plug.App&&Plug.App.addListener){
  Plug.App.addListener("backButton",()=>{if(!$("sheetWrap").hidden){closeSheet()}else if(ui.tab!=="ledger"){ui.tab="ledger";render()}else{Plug.App.exitApp()}});
}

/* ---------------- 시작 ---------------- */
(async()=>{
  const raw=await loadRaw();
  if(raw){st=normalize(raw);if(st.demo){st=blankState();st.items=catalogItems(1);st.settings.catalogSeeded=true;persist()}}
  else{st=blankState();st.items=catalogItems(1);st.settings.catalogSeeded=true;persist()}
  // 재고가 비어 있는 이전 설치본이면 기본 목록을 한 번 넣어 줌
  if(!st.settings.catalogSeeded&&!st.items.length){st.items=catalogItems(1);st.settings.catalogSeeded=true;persist()}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
  const nFix=runFixed();
  render();if(nFix)toast("고정지출 "+nFix+"건을 자동으로 기록했어요");
})();
})();
</script>
